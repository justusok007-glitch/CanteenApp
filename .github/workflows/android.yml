name: Build Android APK

on:
  push:
    branches: [main]
    paths: ['web/**', 'android-res/**', 'android-signing/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Wrap the web app with Capacitor
        run: |
          mkdir app && cd app
          npm init -y >/dev/null
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/app@7 @supabase/supabase-js@2.45.4
          cp -r ../web www
          # keep the Supabase library inside the app so it opens with no internet
          cp node_modules/@supabase/supabase-js/dist/umd/supabase.js www/supabase.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js#supabase.min.js#' www/index.html
          grep -q 'src="supabase.min.js"' www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.canteenrecord.app",
            "appName": "Canteen Record",
            "webDir": "www",
            "backgroundColor": "#0D1420",
            "android": { "allowMixedContent": false }
          }
          JSON
          npx cap add android
          npx cap sync android

      - name: Icons, version and signing key
        run: |
          cd app/android/app
          rm -rf src/main/res/mipmap-anydpi-v26
          cp -r ../../../android-res/* src/main/res/
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" build.gradle
          mkdir -p ~/.android
          cp ../../../android-signing/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        run: |
          cd app/android && chmod +x gradlew
          # the Gradle download is slow and sometimes times out: smaller package, longer timeout
          sed -i 's/-all.zip/-bin.zip/; s/networkTimeout=.*/networkTimeout=180000/' gradle/wrapper/gradle-wrapper.properties
          cat gradle/wrapper/gradle-wrapper.properties
          for i in 1 2 3 4; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Build attempt $i failed, retrying"; sleep 15
          done
          exit 1

      - name: Collect APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk CanteenRecord.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CanteenRecord-apk
          path: CanteenRecord.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest CanteenRecord.apk --title "Canteen Record (latest APK)" \
            --notes "Android app built from the latest web version (build ${{ github.run_number }}). Download CanteenRecord.apk and install it."
